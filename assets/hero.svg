    <text x="70" y="281" fill="#f3f0fb" font-size="15">I turn ideas into systems.</text>
    <text x="70" y="342" fill="#8990a9" font-size="11">JS / TS <tspan fill="#a78bfa">·</tspan> PYTHON <tspan fill="#a78bfa">·</tspan> C# <tspan fill="#a78bfa">·</tspan> MQL5 <tspan fill="#a78bfa">·</tspan> LINUX</text>
